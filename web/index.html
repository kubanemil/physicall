<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physicall - WebGPU Physics Simulation</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="error" class="hidden"></div>
    <div id="controls">
      <div class="select-group">
        <label for="preset-select">Preset:</label>
        <select id="preset-select">
          <option value="0" selected>N-Body</option>
          <option value="1">Cloth</option>
          <option value="2">Rope</option>
        </select>
      </div>
      <button id="pause-btn">Pause</button>
      <div class="reset-group">
        <button id="reset-btn">Reset</button>
        <input type="number" id="particle-count-input" min="1" max="2000" value="500" title="Particle count">
      </div>
      <div class="slider-group">
        <label>Gravity: <span id="gravity-value">0.3</span></label>
        <input type="range" id="gravity-slider" min="-2" max="2" step="0.1" value="0.3">
      </div>
      <div class="slider-group">
        <label>Speed: <span id="speed-value">1.0</span></label>
        <input type="range" id="speed-slider" min="0" max="3" step="0.1" value="1">
      </div>
      <div class="slider-group" id="initial-speed-group">
        <label>Init Speed: <span id="initial-speed-value">0.4</span></label>
        <input type="range" id="initial-speed-slider" min="0" max="2" step="0.1" value="0.4">
      </div>
      <div class="slider-group hidden" id="stiffness-group">
        <label>Stiffness: <span id="stiffness-value">1.0</span></label>
        <input type="range" id="stiffness-slider" min="0" max="1" step="0.05" value="1">
      </div>
      <div class="help-text">
        <small>Left-drag: Orbit | Click: Spawn | Drag particle: Move | Middle-click: Delete | Ctrl+Y: Stats</small>
      </div>
    </div>
    <div id="stats">
      <div class="stat-row"><span class="stat-label">FPS</span><span id="fps-value">--</span></div>
      <div class="stat-row"><span class="stat-label">Frame</span><span id="frametime-value">--</span><span class="stat-unit">ms</span></div>
      <div class="stat-row"><span class="stat-label">Particles</span><span id="stats-particle-count">--</span></div>
    </div>
    <div id="paused-overlay" class="hidden">PAUSED</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
